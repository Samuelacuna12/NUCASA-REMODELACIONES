name: Publish Nucasa website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci
      - name: Build for custom domain
        run: npm run build
        env:
          PAGES_BASE_PATH: /
          PAGES_ORIGIN: https://nucasaremodelaciones.com
      - name: Validate published routes and assets
        run: python3 scripts/validate-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
